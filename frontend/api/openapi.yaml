                - "identifier"
                - "password"
              additionalProperties: false
            example:
              kind: "staff"
              identifier: "anaya.shrestha@northvale.health"
              password: "correct horse battery"
      responses:
        "200":
          description: "Sign in (sets the httpOnly session cookie)"
          content:
            application/json:
              schema:
                oneOf:
                  - type: "object"
                    properties:
                      kind:
                        type: "string"
                        const: "patient"
                      csrfToken:
                        type: "string"
