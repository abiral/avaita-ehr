                      id: "fac_nve"
                      name: "Northvale Eastside Clinic"
                      shortName: "Northvale Eastside"
                      city: "Bhaktapur"
                      timeZone: "Asia/Kathmandu"
                    role: "Physician"
                    departments:
                      - id: "dep_nve_opd"
                        name: "Outpatient clinic"
                        unit: ""
                    permissions:
                      - "chart:read"
                      - "note:write"
                      - "note:sign"
                      - "order:write"
                      - "result:review"
                      - "result:release"
                      - "refill:decide"
                      - "schedule:read"
                      - "schedule:book-for-patient"
        default:
