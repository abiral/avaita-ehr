                          properties:
                            id:
                              type: "string"
                            name:
                              type: "string"
                            shortName:
                              type: "string"
                            city:
                              type: "string"
                            timeZone:
                              type: "string"
                          required:
                            - "id"
                            - "name"
                            - "shortName"
                            - "city"
                            - "timeZone"
                          additionalProperties: false
                    required:
                      - "kind"
                      - "csrfToken"
                      - "organization"
                      - "patient"
                      - "facilities"
                    additionalProperties: false
                  - type: "object"
                    properties:
                      kind:
                        type: "string"
                        const: "staff"
                      csrfToken:
                        type: "string"
                      organization:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                          name:
                            type: "string"
