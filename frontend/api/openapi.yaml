                          - "displayName"
                          - "title"
                        additionalProperties: false
                      memberships:
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            facility:
                              type: "object"
                              properties:
                                id:
                                  type: "string"
                                name:
                                  type: "string"
                                shortName:
                                  type: "string"
                                city:
                                  type: "string"
                                timeZone:
                                  type: "string"
                              required:
                                - "id"
                                - "name"
                                - "shortName"
                                - "city"
                                - "timeZone"
                              additionalProperties: false
                            role:
                              type: "string"
                            departments:
                              type: "array"
                              items:
                                type: "object"
                                properties:
                                  id:
                                    type: "string"
                                  name:
                                    type: "string"
                                  unit:
                                    type: "string"
                                required:
                                  - "id"
                                  - "name"
                                  - "unit"
                                additionalProperties: false
                            permissions:
                              type: "array"
                              items:
                                type: "string"
                                enum:
                                  - "chart:read"
                                  - "note:write"
                                  - "note:sign"
                                  - "order:write"
                                  - "result:review"
                                  - "result:release"
                                  - "refill:decide"
                                  - "schedule:read"
                                  - "schedule:book-for-patient"
                                  - "schedule:admin"
                                  - "package:admin"
                                  - "org:admin"
                          required:
                            - "facility"
                            - "role"
                            - "departments"
                            - "permissions"
                          additionalProperties: false
                    required:
                      - "kind"
                      - "csrfToken"
                      - "organization"
                      - "staff"
                      - "memberships"
                    additionalProperties: false
              example:
                kind: "staff"
                csrfToken: "mock-csrf-token"
                organization:
                  id: "org_northvale"
                  name: "Northvale Health"
                staff:
                  id: "st_anaya"
                  displayName: "Dr. Anaya Shrestha"
                  title: "Hospitalist"
                memberships:
                  - facility:
