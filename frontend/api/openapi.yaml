openapi: "3.1.0"
info:
  title: "Folio EHR API (draft)"
  version: "0.1.0"
  description: "Draft contract owned by the frontend. JSON, camelCase, ISO 8601 UTC timestamps, opaque string ids, cursor pagination ({ items, nextCursor }). Every request carries X-Organization-Id and X-Facility-Id; writes carry X-CSRF-Token. Errors are application/problem+json with a code. Generated by npm run contract:update."
servers:
  - url: "/api"
paths:
  "/session":
    get:
      operationId: "getSession"
      tags:
        - "Session"
      summary: "Current session"
      responses:
        "200":
          description: "Current session"
          content:
            application/json:
              schema:
                oneOf:
                  - type: "object"
                    properties:
                      kind:
                        type: "string"
                        const: "patient"
                      csrfToken:
                        type: "string"
                      organization:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                          name:
                            type: "string"
                        required:
                          - "id"
                          - "name"
                        additionalProperties: false
                      patient:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                          displayName:
                            type: "string"
                          givenName:
                            type: "string"
                          mrn:
                            type: "string"
                        required:
                          - "id"
                          - "displayName"
                          - "givenName"
                          - "mrn"
                        additionalProperties: false
                      facilities:
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            id:
                              type: "string"
                            name:
                              type: "string"
                            shortName:
                              type: "string"
                            city:
                              type: "string"
                            timeZone:
                              type: "string"
                          required:
                            - "id"
                            - "name"
                            - "shortName"
                            - "city"
                            - "timeZone"
                          additionalProperties: false
                    required:
                      - "kind"
                      - "csrfToken"
                      - "organization"
                      - "patient"
                      - "facilities"
                    additionalProperties: false
                  - type: "object"
                    properties:
                      kind:
                        type: "string"
                        const: "staff"
                      csrfToken:
                        type: "string"
                      organization:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                          name:
                            type: "string"
                        required:
                          - "id"
                          - "name"
                        additionalProperties: false
                      staff:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                          displayName:
                            type: "string"
                          title:
                            type: "string"
                        required:
                          - "id"
                          - "displayName"
                          - "title"
                        additionalProperties: false
                      memberships:
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            facility:
                              type: "object"
                              properties:
                                id:
                                  type: "string"
                                name:
                                  type: "string"
                                shortName:
                                  type: "string"
                                city:
                                  type: "string"
                                timeZone:
                                  type: "string"
                              required:
                                - "id"
                                - "name"
                                - "shortName"
                                - "city"
                                - "timeZone"
                              additionalProperties: false
                            role:
                              type: "string"
                            departments:
                              type: "array"
                              items:
                                type: "object"
                                properties:
                                  id:
                                    type: "string"
                                  name:
                                    type: "string"
                                  unit:
                                    type: "string"
                                required:
                                  - "id"
                                  - "name"
                                  - "unit"
                                additionalProperties: false
                            permissions:
                              type: "array"
                              items:
                                type: "string"
                                enum:
                                  - "chart:read"
                                  - "note:write"
                                  - "note:sign"
                                  - "order:write"
                                  - "result:review"
                                  - "result:release"
                                  - "refill:decide"
                                  - "schedule:read"
                                  - "schedule:book-for-patient"
                                  - "schedule:admin"
                                  - "package:admin"
                                  - "org:admin"
                          required:
                            - "facility"
                            - "role"
                            - "departments"
                            - "permissions"
                          additionalProperties: false
                    required:
                      - "kind"
                      - "csrfToken"
                      - "organization"
                      - "staff"
                      - "memberships"
                    additionalProperties: false
              example:
                kind: "patient"
                csrfToken: "mock-csrf-token"
                organization:
                  id: "org_northvale"
                  name: "Northvale Health"
                patient:
                  id: "pt_ramesh"
                  displayName: "Ramesh Pandey"
                  givenName: "Ramesh"
                  mrn: "NVG-188240"
                facilities:
                  - id: "fac_nvg"
                    name: "Northvale General Hospital"
                    shortName: "Northvale General"
                    city: "Kathmandu"
                    timeZone: "Asia/Kathmandu"
        default:
          description: "Problem: unauthenticated, session_locked"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    post:
