  "/password-reset":
    post:
      operationId: "requestReset"
      tags:
        - "Session"
      summary: "Send a password reset link"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                identifier:
                  type: "string"
              required:
                - "identifier"
              additionalProperties: false
            example:
              identifier: "ramesh.pandey@mail.com"
      responses:
        "200":
          description: "Send a password reset link"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  maskedDestination:
                    type: "string"
                required:
                  - "maskedDestination"
                additionalProperties: false
              example:
                maskedDestination: "r•••••.pandey@mail.com"
  "/password-reset/confirm":
    post:
      operationId: "confirmReset"
      tags:
        - "Session"
      summary: "Set a new password"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                token:
                  type: "string"
                password:
                  type: "string"
              required:
                - "token"
                - "password"
              additionalProperties: false
            example:
              token: "reset-demo-token"
              password: "new-password-2026"
      responses:
        "204":
          description: "Set a new password"
        default:
          description: "Problem: validation_failed"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/registrations":
    post:
      operationId: "register"
      tags:
        - "Registration"
      summary: "Start a patient registration"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                givenName:
                  type: "string"
                  minLength: 1
                familyName:
                  type: "string"
                  minLength: 1
                birthDate:
                  type: "string"
                  format: "date"
                sex:
                  type: "string"
                  enum:
                    - "male"
                    - "female"
                    - "other"
                    - "undisclosed"
                mobile:
                  type: "string"
                  minLength: 7
                email:
                  type: "string"
                  format: "email"
                password:
                  type: "string"
                  minLength: 10
                hospitalNumber:
                  type: "string"
                acceptedTerms:
                  type: "boolean"
                  const: true
              required:
                - "givenName"
                - "familyName"
                - "birthDate"
                - "sex"
                - "mobile"
                - "email"
                - "password"
                - "hospitalNumber"
                - "acceptedTerms"
              additionalProperties: false
            example:
              givenName: "Sushila"
              familyName: "Karki"
              birthDate: "1990-04-02"
              sex: "female"
              mobile: "+977 9812345678"
              email: "sushila.karki@mail.com"
              password: "kathmandu2026"
              hospitalNumber: ""
              acceptedTerms: true
      responses:
        "201":
          description: "Start a patient registration"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                  maskedMobile:
                    type: "string"
                required:
                  - "id"
                  - "maskedMobile"
                additionalProperties: false
              example:
                id: "reg_1000"
                maskedMobile: "+977 98XX XXX XXX"
        default:
          description: "Problem: validation_failed"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/registrations/{id}/verify":
    post:
      operationId: "verifyRegistration"
      tags:
        - "Registration"
      summary: "Verify the mobile with the 6-digit code; links existing records and signs in"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                code:
                  type: "string"
                  pattern: "^\\d{6}$"
              required:
                - "code"
              additionalProperties: false
            example:
              code: "481026"
      responses:
        "200":
          description: "Verify the mobile with the 6-digit code; links existing records and signs in"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  mrn:
                    type: "string"
                  facilityName:
                    type:
                      - "string"
                      - "null"
                  linked:
                    type: "object"
                    properties:
                      visits:
                        type: "integer"
                        minimum: 0
                        maximum: 9007199254740991
                      labReports:
                        type: "integer"
                        minimum: 0
                        maximum: 9007199254740991
                      medicines:
                        type: "integer"
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                      - "visits"
                      - "labReports"
                      - "medicines"
                    additionalProperties: false
                required:
                  - "mrn"
                  - "facilityName"
                  - "linked"
                additionalProperties: false
              example:
                mrn: "NVG-188240"
                facilityName: "Northvale General Hospital"
                linked:
                  visits: 2
                  labReports: 6
                  medicines: 3
        default:
          description: "Problem: invalid_code, not_found"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/registrations/{id}/resend":
    post:
      operationId: "resendCode"
      tags:
        - "Registration"
      summary: "Send the code again"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Send the code again"
  "/me/facilities":
    get:
      operationId: "myFacilities"
      tags:
        - "Tenancy"
      summary: "Facilities the user can act in (C1)"
      responses:
        "200":
          description: "Facilities the user can act in (C1)"
          content:
            application/json:
