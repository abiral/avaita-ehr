<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folio · Choose facility</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F9;color:#101828;font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#1F56B4;text-decoration:none}a:hover{color:#174595}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:#5D6B7E}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:6px;border:1px solid #D0D6DE;background:#fff;color:#101828;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer;box-sizing:border-box}
.btn:hover{background:#F7F9FB;color:#101828}
.btn.pri{background:#1F56B4;border-color:#1F56B4;color:#fff}
.btn.pri:hover{background:#174595;color:#fff}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:8px;background:#fff;border:1px solid #E2E6EC;text-align:left}
.opt:hover{border-color:#B7C0CC}
.opt.on{border-color:#1F56B4;box-shadow:0 0 0 1px #1F56B4}
.opt:disabled{cursor:not-allowed;background:#F7F9FB}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid #D0D6DE;background:#fff;font-weight:500;color:#344054}
.chip:hover{border-color:#98A2B3}
.chip.on{background:#EAF1FC;border-color:#1F56B4;color:#174595}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F6F9">
  <header style="height: 60px; box-sizing: border-box; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: #FFFFFF; border-bottom: 1px solid #E2E6EC">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="5" fill="#1F56B4"></rect><path d="M7 7h8M7 11h6M7 15h4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Folio</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; color: #344054">
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #E3E8EF; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #101828">AS</span>
      <span>Dr. Anaya Shrestha</span>
      <a href="Main.dc.html" style="font-size: 13px">Sign out</a>
    </div>
  </header>

  <div style="max-width: 920px; margin: 0 auto; box-sizing: border-box; padding: 56px 24px 72px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2">Select a workspace</h1>
      <p style="margin: 0; color: #475467; font-size: 15px">You have access to {{count}} facilities in Northvale Health. Switch at any time from the sidebar.</p>
    </div>

    <section style="display: flex; flex-direction: column; gap: 12px" aria-labelledby="fac">
      <h2 id="fac" class="cap" style="margin: 0">Facility</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px">
        <sc-for list="{{facilities}}" as="f" hint-placeholder-count="3">
          <button type="button" class="{{f.cls}}" onClick="{{f.pick}}" disabled="{{f.disabled}}" aria-pressed="{{f.on}}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
              <span style="font-size: 16px; font-weight: 600; color: #101828">{{f.name}}</span>
              <span style="width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; border: {{f.ring}}; flex: none"></span>
            </div>
            <span style="color: #5D6B7E; font-size: 13px">{{f.kind}}</span>
            <span style="font-size: 13px; color: #344054; border-top: 1px solid #EDF0F4; padding-top: 12px">{{f.meta}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px" aria-labelledby="dep">
      <h2 id="dep" class="cap" style="margin: 0">Department and role</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{units}}" as="u" hint-placeholder-count="4">
          <button type="button" class="{{u.cls}}" onClick="{{u.pick}}" aria-pressed="{{u.on}}">{{u.label}}</button>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-top: 1px solid #E2E6EC; padding-top: 24px">
      <label style="display: flex; align-items: center; gap: 10px; color: #344054; min-height: 44px; cursor: pointer">
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #1F56B4">
        Remember on this device
      </label>
      <a class="btn pri" href="Dashboard.dc.html">Open workspace</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { fac: 'nvg', unit: 'im' }; }
  renderVals() {
    const fs = [
      { id: 'nvg', name: 'Northvale General Hospital', kind: 'Acute care · 312 beds', meta: 'Hospitalist · Ward 4B, 4C' },
      { id: 'nve', name: 'Northvale Eastside Clinic', kind: 'Outpatient · 14 rooms', meta: 'Tuesday and Thursday clinics' },
      { id: 'lkv', name: 'Lakeview Hospital', kind: 'Joining the network', meta: 'Available after go-live', disabled: true }
    ];
    const us = [
      { id: 'im', label: 'Internal Medicine · Ward 4B' },
      { id: 'im2', label: 'Internal Medicine · Ward 4C' },
      { id: 'ed', label: 'Emergency (cover)' },
      { id: 'op', label: 'Outpatient clinic' }
    ];
    return {
      count: fs.filter(f => !f.disabled).length,
      facilities: fs.map(f => {
        const on = this.state.fac === f.id;
        return { ...f, on, disabled: !!f.disabled,
          cls: 'opt' + (on ? ' on' : ''),
          ring: on ? '5px solid #1F56B4' : '1.5px solid #B7C0CC',
          pick: () => !f.disabled && this.setState({ fac: f.id }) };
      }),
      units: us.map(u => {
        const on = this.state.unit === u.id;
        return { ...u, on, cls: 'chip' + (on ? ' on' : ''), pick: () => this.setState({ unit: u.id }) };
      })
    };
  }
}
</script>
</body>
</html>
